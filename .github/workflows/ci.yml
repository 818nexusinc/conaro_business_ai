name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build the Vercel bundle
        run: npm run build
      - name: Tests (embedded PostgreSQL)
        run: npm test
      - name: Create a non-superuser role, as on Supabase
        run: psql "postgres://postgres:postgres@localhost:5432/postgres" -c "create role app login password 'app' createdb createrole"
      - name: Tests (PostgreSQL 16 via the production driver, non-superuser)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/postgres
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
